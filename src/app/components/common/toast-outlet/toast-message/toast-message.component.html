@if (isVisible()) {
  <div
    (click)="close()"
    animate.enter="fade-in-slide-in-bottom-full"
    class="ignore-overlay-close pointer-events-auto relative bottom-0 left-0 w-full max-w-100 cursor-pointer flex-col items-stretch gap-2 -space-y-0.5 break-all rounded-2xl bg-black p-4 text-white"
  >
    <div [innerText]="toast().message" class="text-background"></div>

    <div
      [innerText]="toast().description"
      class="text-sm text-background/50 empty:hidden"
    ></div>
  </div>
}
