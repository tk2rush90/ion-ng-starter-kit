<ng-content></ng-content>

<div
  [attr.data-theme]="theme()"
  [ngClass]="buttonClasses()"
  class="checkbox-button relative shrink-0 grow-0 rounded-lg border-2 border-solid transition-colors"
>
  @if (isChecked()) {
    <div
      @fadeInOut
      [ngClass]="checkClasses()"
      class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
    >
      <i-lucide [img]="CheckIcon" class="size-full" strokeWidth="3"></i-lucide>
    </div>
  }
</div>
